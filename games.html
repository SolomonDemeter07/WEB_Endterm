<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Games | WH40K Guide</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
                    <img src="images/Aquila.jpg" alt="Aquila Logo" height="30" class="me-2"> 
                    WH40K GUIDE
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="tabletop.html">Tabletop</a></li>
                        <li class="nav-item"><a class="nav-link" href="lore.html">Lore & Books</a></li>
                        <li class="nav-item"><a class="nav-link active" href="games.html">Video Games</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                        <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
                            <button id="themeToggleBtn" class="btn btn-sm btn-outline-warning fw-bold">Light Mode</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-5 pt-5">
        <section class="text-center mb-4">
            <h1 class="display-4 fw-bold text-white mb-4">Digital Warfare</h1>
            <p class="lead text-white">
                Experience the 41st Millennium on your screen. From grand strategy to brutal hack-and-slash, here are the best Warhammer 40,000 video games to get you started.
            </p>
        </section>

        <section class="filter-bar p-3 mb-4 rounded">
            <div class="row g-3 align-items-center">
                <div class="col-md-6">
                    <input type="text" id="gameSearchInput" class="form-control custom-input" placeholder="Search games by title or keyword...">
                </div>
                <div class="col-md-4">
                    <select id="gameGenreFilter" class="form-select custom-input">
                        <option value="all">All Genres</option>
                        <option value="Action / Shooter">Action / Shooter</option>
                        <option value="RTS / Strategy">RTS / Strategy</option>
                        <option value="Classic RPG">Classic RPG</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button id="resetGamesFilterBtn" class="btn btn-outline-warning w-100">Reset</button>
                </div>
            </div>
        </section>

        <section id="gamesContainer" class="games-container mb-5"></section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
